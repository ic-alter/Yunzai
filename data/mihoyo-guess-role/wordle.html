<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>原神 Wordle</title>
  <link rel="stylesheet" href="{{cssFile}}">
</head>
<body>
  <div id="container" class="sheet">
    <div class="header">
      <div>
        <div class="title">原神 Wordle</div>
        <div class="subtitle">{{round}} / {{maxRound}}</div>
      </div>
      <div class="badge">GENSHIN</div>
    </div>

    <div class="table">
      <div class="head">
        <div></div>
        <div>角色</div>
        <div>元素</div>
        <div>武器</div>
        <div>生日</div>
        <div>所属</div>
        <div>天赋书</div>
        <div>HP</div>
        <div>ATK</div>
        <div>DEF</div>
      </div>
      {{each rows row}}
        <div class="row">
          <div class="face"><img src="{{row.faceUrl}}"></div>
          <div class="cell name {{row.nameState}}">{{row.name}}</div>
          <div class="cell {{row.elemState}}">{{row.elem}}</div>
          <div class="cell {{row.weaponState}}">{{row.weapon}}</div>
          <div class="cell {{row.birthState}}">{{row.birth}}</div>
          <div class="cell {{row.allegianceState}}">{{row.allegiance}}</div>
          <div class="cell {{row.talentState}}">{{row.talent}}</div>
          <div class="cell {{row.hpState}}">{{row.hp}}</div>
          <div class="cell {{row.atkState}}">{{row.atk}}</div>
          <div class="cell {{row.defState}}">{{row.def}}</div>
        </div>
      {{/each}}
    </div>

    {{if resultText}}
      <div class="result">{{resultText}}</div>
    {{/if}}
  </div>
</body>
</html>
