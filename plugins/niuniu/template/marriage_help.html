<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <style>
    html, body{ width:fit-content; height:fit-content; }
    body{
      display:inline-block;
      margin:0;
      padding:16px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background: linear-gradient(135deg, #f5f7fb 0%, #eef2ff 100%);
      color:#0f172a;
    }
    .wrap{ width:760px; }

    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .title{
      font-size:20px;
      font-weight:900;
      letter-spacing:0.5px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#eef2ff;
      color:#3730a3;
      border:1px solid #e0e7ff;
      white-space:nowrap;
    }
    .cmd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background:#0f172a;
      color:#e2e8f0;
      padding:2px 6px;
      border-radius:8px;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .item{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:10px 12px;
      min-height:64px;
    }
    .k{
      font-size:12px;
      color:#64748b;
      font-weight:900;
      margin-bottom:6px;
    }
    .v{
      font-size:13px;
      color:#0f172a;
      font-weight:800;
      line-height:1.45;
      word-break:break-word;
    }

    .foot{
      margin-top:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      color:#64748b;
      font-size:12px;
      font-weight:700;
    }
    .hint{
      flex:1;
      padding:8px 10px;
      border-radius:14px;
      background:#f1f5f9;
      border:1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="title">{{title}}</div>
        <div class="badge">指令：<span class="cmd">#婚姻帮助</span></div>
      </div>

      <div class="grid">
        {{each lines it}}
        <div class="item">
          <div class="k">{{it.k}}</div>
          <div class="v">{{it.v}}</div>
        </div>
        {{/each}}
      </div>

    </div>
  </div>
</body>
</html>
