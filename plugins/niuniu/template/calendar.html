<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  font-family: "SimSun", serif;
  background: #f5f5f5;
  margin: 0;
  padding: 14px;            /* 16 -> 14，稍微收一点 */
}

.container {
  width: 740px;             /* 760 -> 740，防右侧被裁 */
  background: #fff;
  padding: 12px 14px 10px;  /* 略缩 */
  border-radius: 10px;
  display: inline-block;    /* 关键 */
}

.title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 8px;
  font-weight: bold;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 13px;
  margin-bottom: 4px;
  color: #333;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;                 /* 6 -> 5 */
}

.day {
  position: relative;
  height: 86px;             /* 88 -> 86 */
  border: 1px solid #ddd;
  border-radius: 8px;
  text-align: center;
  background: #fff;
}

.day.blank {
  border: 0;
  background: transparent;
}


.date {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 11px;
  color: #333;
}

.emoji {
  font-size: 40px;          /* 保持不变：emoji依然够大 */
  margin-top: 20px;
  opacity: 0.22;
  line-height: 1;
}

/* ✔ 更大，并叠在emoji上方 */
.check {
  position: absolute;
  top: 14px;                /* 28 -> 24，稍微上移更像盖章 */
  left: 50%;
  transform: translateX(-50%);
  font-size: 64px;          /* 28 -> 34，更大 */
  color: #20b000;
  font-weight: 900;
  line-height: 1;
}

.count {
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 11px;
  color: #d97706;          /* 橙色（偏琥珀） */
  font-weight: 700;        /* 更醒目 */
  text-shadow: 0 0 1px rgba(255, 255, 255, 0.9); /* 很轻的提亮，防糊 */
}

.summary {
  margin-top: 10px;
  font-size: 14px;
  text-align: center;
  color: #222;
}
</style>
</head>

<body>
<div class="container">
  <div class="title">
    {{yearMonth}} - {{nickname}}的{{emoji}}日历
  </div>

  <div class="week">
    <div>一</div><div>二</div><div>三</div>
    <div>四</div><div>五</div><div>六</div><div>日</div>
  </div>

  <div class="calendar">
    {{each cells c}}
      {{if c.isBlank}}
        <div class="day blank"></div>
      {{else}}
        <div class="day">
          <div class="date">{{c.day}}</div>
          <div class="emoji">{{emoji}}</div>

          {{if c.count > 0}}
            <div class="check">✔</div>
            <div class="count">x{{c.count}}</div>
          {{/if}}
        </div>
      {{/if}}
    {{/each}}
  </div>

  <div class="summary">
    本月总结：累计{{emoji}}了 {{totalDays}} 天，共 {{totalCount}} 次
  </div>

  <div style="height: 8px;"></div>
</div>
</body>
</html>
